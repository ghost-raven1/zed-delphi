name: Delphi installer and environment tools

on:
  workflow_dispatch:
  push:
    branches: [feature/delphi-no-telemetry]
    paths:
      - script/delphi/**
      - .github/workflows/delphi-tools.yml

permissions:
  contents: read

jobs:
  tools:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Verify helper process boundaries
        run: python -m unittest discover -s script/delphi/tests -v
      - name: Install published Linux package
        if: runner.os == 'Linux'
        run: python script/delphi/install.py --destination "$RUNNER_TEMP/Проверка IDE"
      - name: Install and verify published macOS package
        if: runner.os == 'macOS'
        run: python script/delphi/install.py --destination "$RUNNER_TEMP/Проверка IDE.app"
