# Fork-owned workflow. Upstream workflows use private runners and deployment credentials.
name: Delphi fork platform verification

on:
  workflow_dispatch:
    inputs:
      link_editor:
        description: Link the native Zed executable after checks and targeted tests
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: delphi-fork-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_BUILD_JOBS: "2"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  RUST_BACKTRACE: "1"

jobs:
  native:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            runner: ubuntu-24.04
          - platform: windows-x64
            runner: windows-2025
          - platform: macos-arm64
            runner: macos-26
          - platform: macos-x64
            runner: macos-26-intel
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out selected revision
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Set up Node used by upstream tooling
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Prepare verification logs
        run: mkdir -p verification
      - name: Install upstream Linux dependencies and FPC
        if: runner.os == 'Linux'
        run: |
          ./script/linux
          sudo apt-get install -y fp-compiler lldb-18
          echo "CC=clang" >> "$GITHUB_ENV"
          echo "CXX=clang++" >> "$GITHUB_ENV"
      - name: Install macOS build dependencies and FPC
        if: runner.os == 'macOS'
        run: |
          brew install cmake fpc
          xcodebuild -version
          if ! xcrun --find metal; then
            xcodebuild -downloadComponent MetalToolchain
          fi
      - name: Verify Windows native dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installation = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 Microsoft.VisualStudio.Component.VC.Runtimes.x86.x64.Spectre -property installationPath
          if (-not $installation) { throw 'MSVC x64 tools and Spectre libraries are required; see docs/src/development/windows.md' }
          cmake --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install repository Rust toolchain
        run: |
          rustup show active-toolchain
          rustc --version
          cargo --version
      - name: Install upstream WASI SDK
        run: ./script/download-wasi-sdk
      - name: Test build and remote transport helpers
        run: python -m unittest discover -s script/delphi/tests -v 2>&1 | tee verification/python-tests.log
      - name: Verify FPC and real LLDB DAP on Linux
        if: runner.os == 'Linux'
        run: python script/delphi/tests/smoke_lldb.py --fpc "$(command -v fpc)" --lldb-dap "$(command -v lldb-dap-18)" 2>&1 | tee verification/fpc-dap.log
      - name: Verify FPC and real LLDB DAP on macOS
        if: runner.os == 'macOS'
        run: python script/delphi/tests/smoke_lldb.py --fpc "$(command -v fpc)" --lldb-dap "$(xcrun --find lldb-dap)" 2>&1 | tee verification/fpc-dap.log
      - name: Check native editor and remote server
        run: |
          cargo check --locked -p zed --bin zed 2>&1 | tee verification/zed-check.log
          cargo check --locked -p remote_server 2>&1 | tee verification/remote-server-check.log
      - name: Test Delphi grammar and inert telemetry
        run: |
          cargo test --locked -p grammars --features load-grammars --test delphi 2>&1 | tee verification/grammar-tests.log
          cargo test --locked -p telemetry --lib 2>&1 | tee verification/telemetry-tests.log
          cargo test --locked -p client --lib telemetry::tests 2>&1 | tee verification/client-privacy-tests.log
          cargo test --locked -p languages --features test-support --lib delphi::tests 2>&1 | tee verification/lsp-adapter-tests.log
          cargo test --locked -p dap_adapters --lib delphi::tests 2>&1 | tee verification/dap-tests.log
      - name: Link native editor
        if: inputs.link_editor
        run: cargo build --locked -p zed --bin zed 2>&1 | tee verification/zed-build.log
      - name: Save validation logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: delphi-${{ matrix.platform }}-verification
          path: verification/
          if-no-files-found: warn
          retention-days: 14
